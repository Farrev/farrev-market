.bar{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}

.empty{grid-column:1/-1;text-align:center;padding:36px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}

.rv{border-top:1px solid var(--line);padding:12px 0}.stars{color:#ffc857;letter-spacing:2px}

.footer{border-top:1px solid var(--line);margin-top:50px;padding:24px 0;color:var(--muted);font-size:12px}.fg{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
@media(max-width:850px){.hero,.cols,.two{grid-template-columns:1fr}.nav .nt{display:none}.three{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:16px}.brand small{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card .acts .btn{font-size:11px}}
</style></head>

oke="{A}" stroke-width="1.5"><circle cx="100" cy="100" r="80"/><circle cx="100" cy="100" r="60"/><path d="M100 20L166 140H34Z"/><path d="M100 180L34 60H166Z"/></g>',noir:'<g fill="none" stroke="{A}" stroke-width="2"><rect x="8" y="0" width="184" height="200" rx="6" stroke-dasharray="14 10"/></g><circle cx="100" cy="100" r="40" fill="{B}" opacity=".12"/>',retro:'<g fill="{A}" opacity=".55"><circle cx="20" cy="20" r="5"/><circle cx="60" cy="20" r="3"/><circle cx="100" cy="20" r="5"/><circle cx="140" cy="20" r="3"/><circle cx="180" cy="20" r="5"/><circle cx="40" cy="60" r="3"/><circle cx="80" cy="60" r="5"/><circle cx="120" cy="60" r="3"/><circle cx="160" cy="60" r="5"/></g><path d="M0 150Q50 120 100 150T200 150" fill="none" stroke="{B}" stroke-width="6"/>',scifi:'<g fill="none" stroke="{B}" stroke-width="1"><path d="M0 50H200M0 100H200M0 150H200M50 0V200M100 0V200M150 0V200"/></g><circle cx="100" cy="100" r="30" fill="none" stroke="{A}" stroke-width="2"/>',horror:'<circle cx="150" cy="50" r="22" fill="{B}" opacity=".5"/><ellipse cx="60" cy="150" rx="60" ry="10" fill="{A}" opacity=".4"/><ellipse cx="160" cy="180" rx="50" ry="8" fill="{A}" opacity=".3"/>'};
const DEF_CFG={brand:'FARREV MARKET',theme:'custom',accent:'#ff334f',accent2:'#ff6b35',wa:'6281234567890',instagram:'',tiktok:'',facebook:'',announcement:'Selamat datang! Cek detail akun dan tanyakan apa pun sebelum transaksi.',footer:'Website ini adalah prototipe independen, bukan situs resmi Garena.',open:true,bgImgs:{},methods:{transfer:{on:true,bank:'BCA',no:'',name:'FARREV MARKET'},ewallet:{on:true,name:'DANA',no:''},qris:{on:false,img:''}}};

const $=id=>document.getElementById(id);
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=(s='')=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const fmtT=t=>new Date(t).toLocaleString('id-ID');
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return []}};
const saveLs=()=>{localStorage.setItem('fm_cart',JSON.stringify(D.cart));localStorage.setItem('fm_wish',JSON.stringify(D.wish))};

let S={me:null,prof:null,page:'home',sel:null,orderId:null,filter:'all',sort:'featured',search:'',authMode:'login',voucher:'',pay:'',thread:'',adminTab:'overview',editId:null,draft:''};
let D={products:[],cfg:clone(DEF_CFG),cart:lsGet('fm_cart'),wish:lsGet('fm_wish'),vouchers:[],reviews:[],orders:[],notifs:[],users:[],chats:[]};

async function upload(file,path){if(file.size>5*1024*1024)throw new Error('Ukuran gambar maksimal 5 MB');const {error}=await sb.storage.from('media').upload(path,file,{upsert:true,contentType:file.type});if(error)throw error;return sb.storage.from('media').getPublicUrl(path).data.publicUrl+'?v='+Date.now()}

function bgSVG(t){const m=(BGM[t.id]||'').replace(/\{A\}/g,t.a).replace(/\{B\}/g,t.b);return `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><defs><pattern id="p" width="200" height="200" patternUnits="userSpaceOnUse">${m}</pattern><radialGradient id="g"><stop offset="0" stop-color="${t.b}"/><stop offset="1" stop-color="${t.a}" stop-opacity="0"/></radialGradient></defs><rect width="400" height="400" fill="${t.bg}"/><rect width="400" height="400" fill="url(#p)"/></svg>`}

/* ---------- DATA ---------- */
async function loadCfg(){const {data}=await sb.from('settings').select('value').eq('key','config').maybeSingle();if(data?.value)D.cfg={...clone(DEF_CFG),...data.value,methods:{...DEF_CFG.methods,...(data.value.methods||{})}}}

async function prep(p){
 if(['home','catalog','wish'].includes(p))await Promise.all([loadProducts(),loadReviews()]);
 if(p==='detail')await Promise.all([loadProducts(),loadReviews(),loadOrders()]);
 if(p==='cart')await Promise.all([loadProducts(),loadVouchers()]);

 if(p==='notif')await loadNotifs();
 if(p==='admin')await Promise.all([loadProducts(),loadOrders(),loadVouchers(),loadReviews(),loadUsers(),loadChats()]);
}

/* ---------- HELPERS ---------- */
const avgRating=pid=>{const r=D.reviews.filter(x=>x.product_id===pid&&!x.hidden);return r.length?r.reduce((s,x)=>s+x.rating,0)/r.length:0};

const discOf=(v,sub)=>{if(!v||sub<(v.min_total||0))return 0;const d=v.type==='percent'?Math.round(sub*v.value/100):v.value;return Math.min(d,sub)};
const payMethods=()=>Object.keys(D.cfg.methods).filter(k=>D.cfg.methods[k].on);
const canReview=pid=>!!S.me&&!isAdmin()&&D.orders.some(o=>o.status==='Selesai'&&(o.order_items||[]).some(i=>i.products&&D.products.find(p=>p.id===pid&&p.title===i.products.title)))&&!D.reviews.some(r=>r.product_id===pid&&r.user_id===myId());
const nameOf=id=>{const u=D.users.find(x=>x.id===id);return u?(u.name||u.email):(id===myId()?'Kamu':'Pembeli')};

/* ---------- VIEWS ---------- */
function nav(p,l,i,b=0){return `<button class="${S.page===p?'active':''}" onclick="FM.go('${p}')">${i} <span class="nt">${l}</span>${b?`<span class="badge">${b}</span>`:''}</button>`}
function shell(c){return `<header class="topbar"><a class="brand" href="#" onclick="FM.go('home');return false"><span class="logo">F</span><span>${esc(D.cfg.brand)}<small>FREE FIRE MARKETPLACE</small></span></a><nav class="nav">${nav('home','Beranda','⌂')}${nav('catalog','Katalog','▦')}${nav('cart','Keranjang','🛒',D.cart.length)}${nav('orders','Pesanan','🧾')}${nav('wish','Favorit','♥',D.wish.length)}${nav('chat','Chat','✉')}${nav('notif','Notif','🔔',unread())}${nav('social','Sosial','◎')}${isAdmin()?nav('admin','Admin','⚙'):''}</nav><div class="hd">${S.me?`<span class="pill">${isAdmin()?'👑':'👤'} ${esc(S.prof?.name||S.me.email)}</span><button class="btn sm ghost" onclick="FM.logout()">Keluar</button>`:`<button class="btn sm" onclick="FM.go('auth')">Login</button>`}</div></header>${D.cfg.open?'':'<div class="notice" style="margin:0;border-radius:0;text-align:center">Toko sedang tutup sementara. Katalog tetap bisa dilihat.</div>'}${c}<footer class="footer"><div class="wrap fg"><div><b>${esc(D.cfg.brand)}</b><div>${esc(D.cfg.footer)}</div></div><div>© 2026 · <a href="#" style="text-decoration:underline" onclick="FM.go('safety');return false">Panduan transaksi aman</a></div></div></footer>`}

function productCard(p){const sold=p.status!=='Tersedia',w=D.wish.includes(p.id),av=avgRating(p.id);return `<article class="card"><div class="cover">${p.image_url?`<img src="${esc(p.image_url)}" alt="" onerror="this.remove()">`:esc(p.emoji||'🎮')}<span class="tag">${esc(p.tag||'LISTING')}</span></div><div class="cb"><h3>${esc(p.title)}</h3><div class="price">${rp(p.price)}</div><div class="chips"><span class="chip">🏆 ${esc(p.rank)}</span><span class="chip">Lv ${esc(p.level)}</span>${av?`<span class="chip">★ ${av.toFixed(1)}</span>`:''}<span class="chip ${sold?'err':'ok'}">${esc(p.status)}</span></div><div class="muted small">${esc((p.description||'').slice(0,90))}</div><div class="acts"><button class="btn sm sec" onclick="FM.go('detail',${p.id})">Detail</button>${sold?'':`<button class="btn sm" onclick="FM.cart(${p.id})">+ Keranjang</button>`}<button class="btn sm ghost" onclick="FM.wish(${p.id})">${w?'♥':'♡'}</button></div></div></article>`}
function gridHTML(){const q=S.search.toLowerCase();let arr=D.products.filter(p=>(S.filter==='all'||p.rank===S.filter)&&`${p.title} ${p.rank} ${p.description}`.toLowerCase().includes(q));arr.sort((a,b)=>S.sort==='low'?a.price-b.price:S.sort==='high'?b.price-a.price:(Number(b.featured)-Number(a.featured)));return arr.map(productCard).join('')||'<div class="empty">Tidak ada listing yang cocok.</div>'}

function home(){const av=D.products.filter(p=>p.status==='Tersedia').length,feat=D.products.filter(p=>p.featured).slice(0,3);return shell(`<main class="wrap"><section class="hero"><div><span class="eyebrow">● MARKETPLACE GAMING</span><h1>Temukan akun FF<br><span class="gradient">yang cocok buatmu.</span></h1><p>${esc(D.cfg.announcement)}</p><div class="acts" style="margin-top:22px;max-width:380px"><button class="btn" onclick="FM.go('catalog')">Jelajahi katalog →</button><button class="btn sec" onclick="FM.go('chat')">💬 Chat admin</button></div><div class="stats"><div class="stat"><strong>${D.products.length}</strong><span>Listing</span></div><div class="stat"><strong>${av}</strong><span>Tersedia</span></div><div class="stat"><strong>24/7</strong><span>Pesan kapan saja</span></div></div></div><div class="art"><span class="eyebrow" style="align-self:flex-start">FEATURED</span><div class="gradient" style="font-weight:1000;font-size:clamp(34px,6vw,54px);line-height:1">LEVEL UP.<br>PLAY MORE.</div><div style="font-size:44px">🎮</div></div></section><div class="sec-h"><div><h2>Listing pilihan</h2><div class="muted small">Akun unggulan dari FARREV MARKET</div></div><button class="btn sec sm" onclick="FM.go('catalog')">Lihat semua</button></div><div class="grid">${(feat.length?feat:D.products.slice(0,3)).map(productCard).join('')||'<div class="empty">Belum ada listing.</div>'}</div></main>`)}

function catalog(){return shell(`<main class="wrap"><div class="sec-h" style="margin-top:14px"><div><h1 style="font-size:30px;margin:0">Katalog akun</h1><div class="muted">Cari, bandingkan, lalu masukkan ke keranjang atau tanya admin.</div></div></div><div class="toolbar"><input class="field" placeholder="Cari nama, rank, atau deskripsi..." value="${esc(S.search)}" oninput="FM.search(this.value)"><select class="field" onchange="FM.set('filter',this.value)"><option value="all">Semua rank</option>${RANKS.map(r=>`<option ${S.filter===r?'selected':''}>${r}</option>`).join('')}</select><select class="field" onchange="FM.set('sort',this.value)"><option value="featured">Rekomendasi</option><option value="low" ${S.sort==='low'?'selected':''}>Harga terendah</option><option value="high" ${S.sort==='high'?'selected':''}>Harga tertinggi</option></select></div><div class="grid" id="grid">${gridHTML()}</div></main>`)}

function reviewBlock(p){const list=D.reviews.filter(r=>r.product_id===p.id&&(!r.hidden||isAdmin()));const av=avgRating(p.id);const reviewed=D.reviews.some(r=>r.product_id===p.id&&r.user_id===myId());return `<div style="margin-top:22px"><h3>Ulasan pembeli (${list.length})</h3><div class="muted small" style="margin-bottom:6px">${av?`<span class="stars">${starsOf(av)}</span> ${av.toFixed(1)} / 5`:'Belum ada ulasan'}</div>${list.map(r=>`<div class="rv"><div style="display:flex;justify-content:space-between;gap:8px"><b>Pembeli terverifikasi</b><span class="stars">${starsOf(r.rating)}</span></div><div class="small" style="margin-top:4px">${esc(r.text)}</div>${r.hidden?'<div class="small err">Disembunyikan admin</div>':''}<div class="muted small">${fmtT(r.created_at)}</div></div>`).join('')}${canReview(p.id)&&!reviewed?`<div class="fr" style="margin-top:14px"><label>Beri ulasan</label><select class="field" id="rvR" style="width:auto"><option value="5">5 ★</option><option value="4">4 ★</option><option value="3">3 ★</option><option value="2">2 ★</option><option value="1">1 ★</option></select><textarea class="field" id="rvT" rows="2" maxlength="300" placeholder="Ceritakan pengalamanmu" style="margin-top:8px"></textarea><button class="btn sm" style="margin-top:8px" onclick="FM.review(${p.id})">Kirim ulasan</button></div>`:''}</div>`}

function detail(){const p=D.products.find(x=>x.id===S.sel);if(!p)return catalog();const sold=p.status!=='Tersedia',w=D.wish.includes(p.id);return shell(`<main class="wrap"><button class="btn ghost sm" style="margin-top:14px" onclick="FM.go('catalog')">← Katalog</button><div class="cols" style="margin-top:16px"><div class="art" style="min-height:300px;justify-content:center;align-items:center;font-size:90px">${p.image_url?`<img src="${esc(p.image_url)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.remove()">`:esc(p.emoji||'🎮')}</div><div class="panel"><span class="eyebrow">${esc(p.tag||'LISTING')}</span><h1 style="font-size:30px;margin:14px 0 6px">${esc(p.title)}</h1><div class="price" style="font-size:26px">${rp(p.price)}</div><div class="chips" style="margin:12px 0"><span class="chip">Rank ${esc(p.rank)}</span><span class="chip">Level ${esc(p.level)}</span><span class="chip ${sold?'err':'ok'}">${esc(p.status)}</span></div><p class="muted" style="line-height:1.7">${esc(p.description)}</p><div class="notice">Pastikan detail, akses, dan risiko akun dibahas sebelum membayar.</div><div class="acts" style="margin-top:14px">${sold?'<button class="btn" disabled>Tidak tersedia</button>':`<button class="btn" onclick="FM.cart(${p.id})">🛒 Tambah ke keranjang</button>`}<button class="btn sec" onclick="FM.ask(${p.id})">💬 Tanya admin</button><button class="btn ghost" onclick="FM.wish(${p.id})">${w?'♥ Disimpan':'♡ Simpan'}</button></div>${reviewBlock(p)}</div></div></main>`)}

function cartPage(){const items=cartItems(),sub=items.reduce((s,p)=>s+p.price,0),v=findVoucher(S.voucher),d=discOf(v,sub),tot=sub-d,methods=payMethods();if(!methods.includes(S.pay))S.pay=methods[0]||'';
return shell(`<main class="wrap"><div class="sec-h" style="margin-top:14px"><div><h1 style="font-size:30px;margin:0">Keranjang</h1><div class="muted">Pilih metode pembayaran lalu buat pesanan.</div></div></div>${!items.length?`<div class="empty">Keranjang masih kosong.<br><br><button class="btn sm" onclick="FM.go('catalog')">Cari akun</button></div>`:`<div class="cols"><div class="panel">${items.map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${esc(p.title)}</b><div class="muted small">Rank ${esc(p.rank)} · Lv ${esc(p.level)}</div></div><div class="acts"><b>${rp(p.price)}</b><button class="btn sm danger" onclick="FM.uncart(${p.id})">✕</button></div></div>`).join('')}<div class="fr"><label>Kode voucher</label><div class="acts"><input class="field" id="vc" value="${esc(S.voucher)}" placeholder="Contoh: HEMAT10" style="flex:1"><button class="btn sec" onclick="FM.applyVoucher()">Pakai</button></div><div class="small ${v?'ok':S.voucher?'err':'muted'}" style="margin-top:6px">${v?`Voucher ${esc(v.code)} aktif`:S.voucher?'Voucher tidak valid atau belum memenuhi syarat':'Masukkan kode jika punya'}</div></div><h3 style="margin-top:18px">Metode pembayaran</h3>${methods.length?`<div class="pm">${methods.map(m=>`<label><input type="radio" name="pay" ${S.pay===m?'checked':''} onchange="FM.setPay('${m}')"><b>${PAYLBL[m]}</b></label>`).join('')}</div>`:'<div class="notice">Belum ada metode pembayaran aktif. Hubungi admin.</div>'}<p class="muted small" style="margin-top:10px">Pembayaran diverifikasi admin setelah kamu mengirim konfirmasi.</p></div><aside class="panel"><h3>Ringkasan</h3><div style="display:flex;justify-content:space-between;margin:8px 0"><span class="muted">Subtotal</span><span>${rp(sub)}</span></div><div style="display:flex;justify-content:space-between;margin:8px 0"><span class="muted">Diskon</span><span class="ok">− ${rp(d)}</span></div><div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;margin-top:8px;font-size:20px;font-weight:900"><span>Total</span><span class="price">${rp(tot)}</span></div><button class="btn full" style="margin-top:16px" ${!D.cfg.open||!methods.length?'disabled':''} onclick="FM.checkout()">Buat pesanan</button>${!S.me?'<div class="small muted" style="margin-top:8px">Kamu perlu login untuk membuat pesanan.</div>':''}</aside></div>`}</main>`)}

function payInfo(m){const c=D.cfg.methods[m]||{};if(m==='transfer')return `Bank <b>${esc(c.bank)}</b><br>No. rekening <b>${esc(c.no)}</b><br>a.n. ${esc(c.name)}`;if(m==='ewallet')return `${esc(c.name)} <b>${esc(c.no)}</b><br>a.n. ${esc(D.cfg.brand)}`;return c.img?`<img src="${esc(c.img)}" alt="QRIS" style="max-width:220px;border-radius:12px;background:#fff;padding:8px" onerror="this.remove()">`:'QRIS belum tersedia. Hubungi admin via WhatsApp.'}

function orderPage(){const o=D.orders.find(x=>x.id===S.orderId);if(!o)return ordersPage();const st=o.status,msg=`Halo admin, saya sudah membayar pesanan ${o.id} (${rp(o.total)}).`;const items=(o.order_items||[]).map(i=>({title:i.products?.title||'Akun',price:i.price}));
return shell(`<main class="wrap"><button class="btn ghost sm" style="margin-top:14px" onclick="FM.go('orders')">← Pesanan saya</button><div class="cols" style="margin-top:16px"><div class="panel"><span class="eyebrow">${o.id}</span><h2 style="margin:14px 0 4px">Instruksi pembayaran</h2><p class="muted small">Status: <b class="${st==='Dibatalkan'?'err':'ok'}">${esc(st)}</b> · ${PAYLBL[o.method]||''}</p><div class="notice" style="color:var(--text);background:none;border-color:var(--line)">${payInfo(o.method)}</div><p>Transfer tepat sebesar <b>${rp(o.total)}</b>.</p>${st==='Menunggu pembayaran'?`<div class="fr"><label>Catatan / no. referensi (opsional)</label><input class="field" id="proof" maxlength="120" placeholder="Contoh: ref 123456"></div><div class="acts"><button class="btn" onclick="FM.paid('${o.id}')">✔ Saya sudah bayar</button>${D.cfg.wa?`<a class="btn sec" target="_blank" rel="noopener" href="https://wa.me/${D.cfg.wa}?text=${encodeURIComponent(msg)}">Konfirmasi WA ↗</a>`:''}</div>`:`<p class="muted small">${st==='Menunggu verifikasi'?'Konfirmasimu sedang diverifikasi admin.':st==='Selesai'?'Pesanan selesai. Terima kasih!':''}</p>`}</div><aside class="panel"><h3>Detail pesanan</h3>${items.map(i=>`<div class="small" style="display:flex;justify-content:space-between;padding:6px 0"><span>${esc(i.title)}</span><b>${rp(i.price)}</b></div>`).join('')}<div class="small" style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px"><div style="display:flex;justify-content:space-between"><span class="muted">Subtotal</span><span>${rp(o.subtotal)}</span></div><div style="display:flex;justify-content:space-between"><span class="muted">Diskon ${esc(o.voucher||'-')}</span><span>− ${rp(o.discount)}</span></div><div style="display:flex;justify-content:space-between;font-weight:900;font-size:16px;margin-top:8px"><span>Total</span><span>${rp(o.total)}</span></div></div><p class="muted small">Dibuat ${fmtT(o.created_at)}</p></aside></div></main>`)}

function ordersPage(){if(!S.me)return authPage();return shell(`<main class="wrap"><div class="sec-h" style="margin-top:14px"><div><h1 style="font-size:30px;margin:0">Pesanan saya</h1><div class="muted">Pantau status pembayaran dan pesananmu.</div></div></div><div class="panel"><div class="tw"><table><thead><tr><th>ID</th><th>Item</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>${D.orders.map(o=>`<tr><td>${o.id}<div class="muted small">${fmtT(o.created_at)}</div></td><td>${(o.order_items||[]).map(i=>esc(i.products?.title)).join('<br>')}</td><td>${rp(o.total)}</td><td>${esc(o.status)}</td><td><button class="btn sm sec" onclick="FM.openOrder('${o.id}')">Buka</button></td></tr>`).join('')||'<tr><td colspan=5><div class="empty" style="border:0">Belum ada pesanan.</div></td></tr>'}</tbody></table></div></div></main>`)}

function wishPage(){const arr=D.products.filter(p=>D.wish.includes(p.id));return shell(`<main class="wrap"><div class="sec-h" style="margin-top:14px"><div><h1 style="font-size:30px;margin:0">Favorit</h1><div class="muted">Akun yang kamu simpan di perangkat ini.</div></div></div><div class="grid">${arr.map(productCard).join('')||'<div class="empty">Belum ada favorit. Tekan ♡ pada listing.</div>'}</div></main>`)}

function authPage(){const reg=S.authMode==='register';return shell(`<main class="wrap" style="max-width:440px;margin-top:30px"><div class="panel" style="padding:26px"><h1 style="font-size:26px;margin:0 0 6px">${reg?'Buat akun baru':'Selamat datang kembali'}</h1><form onsubmit="FM.authSubmit(event)">${reg?'<div class="fr"><label>Nama tampilan</label><input class="field" id="aName" required maxlength="40"></div>':''}<div class="fr"><label>Email</label><input class="field" id="aEmail" type="email" required></div><div class="fr"><label>Password</label><input class="field" id="aPass" type="password" required minlength="6"></div><div id="aMsg" class="small" style="margin:8px 0"></div><button class="btn full">${reg?'Daftar':'Login'}</button></form><p class="small" style="text-align:center;margin-top:14px">${reg?'Sudah punya akun?':'Belum punya akun?'} <a href="#" style="color:var(--accent);font-weight:800" onclick="FM.authMode('${reg?'login':'register'}');return false">${reg?'Login':'Daftar sekarang'}</a></p><div class="divider">atau</div><button class="btn sec full" onclick="FM.google()">◎ Lanjutkan dengan Google</button></div></main>`)}

function chatPage(){if(!S.me)return authPage();const adm=isAdmin();const threads=[...new Set(D.chats.map(m=>m.thread_user))];const th=adm?(S.thread||threads[0]||''):myId();const list=D.chats.filter(m=>m.thread_user===th);const draft=S.draft;S.draft='';
return shell(`<main class="wrap"><div class="sec-h" style="margin-top:14px"><div><h1 style="font-size:30px;margin:0">Chat admin</h1><div class="muted">Pesan tersimpan di database.</div></div><button class="btn sec sm" onclick="FM.go('chat')">Muat ulang</button></div><div class="cols"><aside class="panel">${adm?`<div class="fr"><label>Pilih pembeli</label><select class="field" onchange="FM.selThread(this.value)">${threads.map(t=>`<option value="${esc(t)}" ${th===t?'selected':''}>${esc(nameOf(t))}</option>`).join('')||'<option value="">Belum ada chat</option>'}</select></div>`:'<p class="muted small">Percakapan kamu dengan admin FARREV.</p>'}<div class="notice">Jangan kirim password, OTP, atau data kartu di chat.</div></aside><section class="panel" style="padding:0;display:flex;flex-direction:column"><div class="msgs" style="flex:1">${list.length?list.map(m=>`<div class="bub ${m.sender_id===myId()?'mine':''}"><b>${esc(nameOf(m.sender_id))}</b><br>${esc(m.body)}<div class="muted small" style="margin-top:4px">${fmtT(m.created_at)}</div></div>`).join(''):'<div class="empty" style="border:0">Belum ada pesan.</div>'}</div><form onsubmit="FM.send(event)" style="display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)"><input id="chatIn" class="field" maxlength="1000" required placeholder="Tulis pesan..." value="${esc(draft)}"><button class="btn">Kirim</button></form></section></div></main>`)}

function notifPage(){if(!S.me)return authPage();return shell(`<main class="wrap"><div class="sec-h" style="margin-top:14px"><div><h1 style="font-size:30px;margin:0">Notifikasi</h1><div class="muted">Update pesanan, pembayaran, dan ulasan.</div></div><button class="btn sec sm" onclick="FM.readAll()">Tandai semua dibaca</button></div><div class="panel" style="padding:0">${D.notifs.map(n=>`<div class="notif ${n.read?'':'unread'}"><div style="flex:1"><b>${esc(n.title)}</b><div class="small muted" style="margin-top:3px">${esc(n.body)}</div><div class="muted small" style="margin-top:4px">${fmtT(n.created_at)}</div></div></div>`).join('')||'<div class="empty" style="border:0">Belum ada notifikasi.</div>'}</div></main>`)}

function social(){const L=(i,t,d,u,c)=>`<div class="panel"><div style="font-size:30px">${i}</div><h2>${t}</h2><p class="muted small">${d}</p>${u?`<a class="btn ${c}" target="_blank" rel="noopener" href="${esc(u)}">Buka ${t} ↗</a>`:'<span class="muted small">Belum diatur admin</span>'}</div>`;return shell(`<main class="wrap"><div class="sec-h" style="margin-top:14px"><div><h1 style="font-size:30px;margin:0">Temukan FARREV</h1><div class="muted">Ikuti update listing dan hubungi admin lewat kanal resmi.</div></div></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${L('📱','WhatsApp','Tanya listing dan diskusikan detail sebelum transaksi.',D.cfg.wa?'https://wa.me/'+D.cfg.wa:'','')}${L('◎','Instagram','Update konten dan informasi toko.',D.cfg.instagram,'sec')}${L('♪','TikTok','Konten gaming dan highlight pilihan.',D.cfg.tiktok,'sec')}${L('f','Facebook','Komunitas dan kabar terbaru.',D.cfg.facebook,'sec')}</div></main>`)}
function safety(){return shell(`<main class="wrap"><div class="sec-h" style="margin-top:14px"><div><h1 style="font-size:30px;margin:0">Panduan transaksi aman</h1><div class="muted">Lindungi akun, uang, dan data pribadi.</div></div></div><div class="panel" style="line-height:1.9"><ul><li>Minta detail inventory, rank, region, dan kondisi akses terbaru.</li><li>Periksa risiko kehilangan akses dan kebijakan resmi game; jual beli akun dapat bertentangan dengan ketentuan layanan.</li><li>Simpan bukti transaksi.</li><li>Jangan bagikan password email pribadi, OTP, atau kode pemulihan.</li><li>Jangan percaya bukti transfer berupa screenshot saja; cek dana masuk secara mandiri.</li></ul><p class="muted">Website ini prototipe independen dan bukan situs resmi Garena.</p></div></main>`)}

/* ---------- ADMIN ---------- */
function adminPage(){if(!isAdmin())return shell('<main class="wrap"><div class="panel" style="margin-top:20px">Akses admin ditolak.</div></main>');
const TABS=[['overview','Ringkasan'],['products','Produk'],['orders','Pesanan'],['reviews','Ulasan'],['vouchers','Voucher'],['store','Toko & bayar'],['themes','Tema'],['users','Pengguna'],['chat','Chat']];
const T={overview:tOverview,products:tProducts,orders:tOrders,reviews:tReviews,vouchers:tVouchers,store:tStore,themes:tThemes,users:tUsers,chat:tChat};
return shell(`<main class="wrap"><span class="eyebrow">ADMIN CONTROL CENTER</span><h1 style="font-size:30px">Panel admin</h1><div class="tabs">${TABS.map(([k,l])=>`<button class="${S.adminTab===k?'active':''}" onclick="FM.adminTab('${k}')">${l}</button>`).join('')}</div>${(T[S.adminTab]||tOverview)()}</main>`)}
function tOverview(){const paid=D.orders.filter(o=>['Diproses','Selesai'].includes(o.status)),rev=paid.reduce((s,o)=>s+o.total,0);return `<div class="stats"><div class="stat"><strong>${rp(rev)}</strong><span>Pendapatan terkonfirmasi</span></div><div class="stat"><strong>${D.orders.length}</strong><span>Total pesanan</span></div><div class="stat"><strong>${D.orders.filter(o=>o.status==='Menunggu verifikasi').length}</strong><span>Perlu verifikasi</span></div><div class="stat"><strong>${D.products.filter(p=>p.status==='Tersedia').length}/${D.products.length}</strong><span>Listing tersedia</span></div><div class="stat"><strong>${D.users.length}</strong><span>Pengguna</span></div><div class="stat"><strong>${D.reviews.length}</strong><span>Ulasan</span></div></div><div class="panel"><h3>Status pesanan</h3>${STATUSES.map(s=>{const n=D.orders.filter(o=>o.status===s).length;return `<div style="margin:10px 0"><div class="small" style="display:flex;justify-content:space-between"><span>${s}</span><b>${n}</b></div><div class="bar"><i style="width:${D.orders.length?n/D.orders.length*100:0}%"></i></div></div>`}).join('')}</div>`}
function tProducts(){const e=D.products.find(p=>p.id===S.editId)||{};const sel=(o,v)=>o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
return `<div class="panel"><h3>${S.editId?'Edit listing':'Tambah listing'}</h3><form onsubmit="FM.saveProduct(event)"><div class="two"><div class="fr"><label>Nama listing</label><input class="field" id="pT" required maxlength="100" value="${esc(e.title||'')}"></div><div class="fr"><label>Harga (Rp)</label><input class="field" id="pP" type="number" min="1" required value="${e.price||''}"></div><div class="fr"><label>Rank</label><select class="field" id="pR">${sel(RANKS,e.rank||'Platinum')}</select></div><div class="fr"><label>Level</label><input class="field" id="pL" type="number" min="1" max="100" value="${e.level||50}"></div><div class="fr"><label>Tag</label><input class="field" id="pTg" maxlength="12" value="${esc(e.tag||'')}" placeholder="HOT / RARE / NEW"></div><div class="fr"><label>Emoji cover</label><input class="field" id="pE" maxlength="8" value="${esc(e.emoji||'🎮')}"></div><div class="fr"><label>Status</label><select class="field" id="pS">${sel(['Tersedia','Dipesan','Terjual'],e.status||'Tersedia')}</select></div><div class="fr"><label>Unggulan</label><select class="field" id="pF"><option value="0" ${e.featured?'':'selected'}>Tidak</option><option value="1" ${e.featured?'selected':''}>Ya</option></select></div></div><div class="fr"><label>Foto produk dari perangkat (opsional)</label><input class="field" id="pFile" type="file" accept="image/*"></div><div class="fr"><label>Deskripsi</label><textarea class="field" id="pD" rows="3" required>${esc(e.description||'')}</textarea></div><div class="acts"><button class="btn">${S.editId?'Simpan perubahan':'+ Tambah listing'}</button>${S.editId?'<button type="button" class="btn sec" onclick="FM.editProduct(null)">Batal</button>':''}</div></form></div><div class="panel" style="margin-top:14px"><h3>Daftar listing (${D.products.length})</h3><div class="tw"><table><thead><tr><th>Nama</th><th>Harga</th><th>Status</th><th>Unggulan</th><th></th></tr></thead><tbody>${D.products.map(p=>`<tr><td>${esc(p.title)}<div class="muted small">${esc(p.rank)} · Lv ${esc(p.level)}</div></td><td>${rp(p.price)}</td><td>${esc(p.status)}</td><td><button class="btn sm sec" onclick="FM.toggleFeat(${p.id})">${p.featured?'★ Ya':'☆ Tidak'}</button></td><td style="white-space:nowrap"><button class="btn sm sec" onclick="FM.editProduct(${p.id})">Edit</button> <button class="btn sm danger" onclick="FM.delProduct(${p.id})">Hapus</button></td></tr>`).join('')||'<tr><td colspan=5>Belum ada listing.</td></tr>'}</tbody></table></div></div>`}
function tOrders(){return `<div class="panel"><h3>Pesanan masuk (${D.orders.length})</h3><div class="tw"><table><thead><tr><th>ID</th><th>Pembeli</th><th>Item</th><th>Total</th><th>Metode</th><th>Status</th></tr></thead><tbody>${D.orders.map(o=>`<tr><td>${o.id}<div class="muted small">${fmtT(o.created_at)}</div></td><td>${esc(nameOf(o.user_id))}${o.proof?`<div class="small">Catatan: ${esc(o.proof)}</div>`:''}</td><td>${(o.order_items||[]).map(i=>esc(i.products?.title)).join('<br>')}</td><td>${rp(o.total)}</td><td>${PAYLBL[o.method]||'-'}</td><td><select class="field" style="min-width:180px" onchange="FM.setStatus('${o.id}',this.value)">${STATUSES.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan=6>Belum ada pesanan.</td></tr>'}</tbody></table></div></div>`}
function tReviews(){return `<div class="panel"><h3>Ulasan (${D.reviews.length})</h3><div class="tw"><table><thead><tr><th>Produk</th><th>Rating</th><th>Ulasan</th><th></th></tr></thead><tbody>${D.reviews.map(r=>`<tr><td>${esc((D.products.find(p=>p.id===r.product_id)||{}).title||'-')}</td><td class="stars">${starsOf(r.rating)}</td><td>${esc(r.text)}${r.hidden?'<div class="err small">Disembunyikan</div>':''}</td><td style="white-space:nowrap"><button class="btn sm sec" onclick="FM.hideReview(${r.id},${!r.hidden})">${r.hidden?'Tampilkan':'Sembunyikan'}</button> <button class="btn sm danger" onclick="FM.delReview(${r.id})">Hapus</button></td></tr>`).join('')||'<tr><td colspan=4>Belum ada ulasan.</td></tr>'}</tbody></table></div></div>`}
function tVouchers(){return `<div class="panel"><h3>Voucher</h3><div class="tw"><table><thead><tr><th>Kode</th><th>Jenis</th><th>Nilai</th><th>Min. belanja</th><th></th></tr></thead><tbody>${D.vouchers.map(v=>`<tr><td><b>${esc(v.code)}</b></td><td>${v.type==='percent'?'Persen':'Potongan'}</td><td>${v.type==='percent'?v.value+'%':rp(v.value)}</td><td>${rp(v.min_total)}</td><td style="white-space:nowrap"><button class="btn sm sec" onclick="FM.vToggle('${esc(v.code)}',${!v.active})">${v.active?'Nonaktifkan':'Aktifkan'}</button> <button class="btn sm danger" onclick="FM.vDel('${esc(v.code)}')">Hapus</button></td></tr>`).join('')||'<tr><td colspan=5>Belum ada voucher.</td></tr>'}</tbody></table></div></div><div class="panel" style="margin-top:14px"><h3>Tambah voucher</h3><form onsubmit="FM.vAdd(event)"><div class="two"><div class="fr"><label>Kode</label><input class="field" id="vCo" required maxlength="20" style="text-transform:uppercase"></div><div class="fr"><label>Jenis</label><select class="field" id="vTy"><option value="percent">Persen (%)</option><option value="fixed">Potongan (Rp)</option></select></div><div class="fr"><label>Nilai</label><input class="field" id="vVa" type="number" min="1" required></div><div class="fr"><label>Min. belanja (Rp)</label><input class="field" id="vMi" type="number" min="0" value="0"></div></div><button class="btn">+ Tambah voucher</button></form></div>`}
function tStore(){const c=D.cfg,m=c.methods;return `<div class="panel"><h3>Pengaturan toko</h3><form onsubmit="FM.saveStore(event)"><div class="two"><div class="fr"><label>Nama brand</label><input class="field" id="sBr" required value="${esc(c.brand)}"></div><div class="fr"><label>Status toko</label><select class="field" id="sOp"><option value="1" ${c.open?'selected':''}>Buka</option><option value="0" ${c.open?'':'selected'}>Tutup sementara</option></select></div></div><div class="fr"><label>Pengumuman beranda</label><textarea class="field" id="sAn" rows="2">${esc(c.announcement)}</textarea></div><div class="fr"><label>Teks footer</label><input class="field" id="sFo" value="${esc(c.footer)}"></div><div class="two"><div class="fr"><label>WhatsApp (format 62...)</label><input class="field" id="sWa" value="${esc(c.wa)}"></div><div class="fr"><label>Instagram URL</label><input class="field" id="sIg" value="${esc(c.instagram)}"></div><div class="fr"><label>TikTok URL</label><input class="field" id="sTt" value="${esc(c.tiktok)}"></div><div class="fr"><label>Facebook URL</label><input class="field" id="sFb" value="${esc(c.facebook)}"></div></div><h3 style="margin-top:18px">Pembayaran</h3><div class="fr"><label><input type="checkbox" id="mT" ${m.transfer.on?'checked':''}> Transfer bank</label></div><div class="two"><div class="fr"><label>Nama bank</label><input class="field" id="tB" value="${esc(m.transfer.bank)}"></div><div class="fr"><label>No. rekening</label><input class="field" id="tN" value="${esc(m.transfer.no)}"></div></div><div class="fr"><label>Atas nama</label><input class="field" id="tA" value="${esc(m.transfer.name)}"></div><div class="fr"><label><input type="checkbox" id="eOn" ${m.ewallet.on?'checked':''}> E-wallet</label></div><div class="two"><div class="fr"><label>Nama e-wallet</label><input class="field" id="eN" value="${esc(m.ewallet.name)}"></div><div class="fr"><label>No. e-wallet</label><input class="field" id="eNo" value="${esc(m.ewallet.no)}"></div></div><div class="fr"><label><input type="checkbox" id="qOn" ${m.qris.on?'checked':''}> QRIS</label></div><div class="fr"><label>Gambar QRIS dari perangkat</label><input class="field" id="qFile" type="file" accept="image/*"></div><button class="btn">Simpan toko</button></form></div>`}
function tThemes(){const c=D.cfg;return `<div class="panel"><h3>Tema</h3><p class="muted small">Pilih satu tema. Warna dan latar langsung berubah.</p><div class="swatches">${THEMES.map(t=>`<button class="sw ${c.theme===t.id?'active':''}" style="background:${t.bg}" onclick="FM.setTheme('${t.id}')"><i style="background:linear-gradient(90deg,${t.a},${t.b})"></i>${esc(t.n)}</button>`).join('')}</div><div class="fr" style="margin-top:16px"><label>Gambar latar untuk tema aktif (dari perangkat)</label><input class="field" type="file" accept="image/*" onchange="FM.uploadThemeBg(this)"></div><button class="btn sec sm" onclick="FM.clearThemeBg()">Hapus gambar latar tema ini</button><h3 style="margin-top:22px">Warna kustom</h3><div class="two"><div class="fr"><label>Warna utama</label><input class="field" id="cA" type="color" value="${c.accent}"></div><div class="fr"><label>Warna aksen</label><input class="field" id="cB" type="color" value="${c.accent2}"></div></div><button class="btn sec" onclick="FM.customTheme()">Pakai warna kustom</button></div>`}
function tUsers(){return `<div class="panel"><h3>Pengguna (${D.users.length})</h3><div class="tw"><table><thead><tr><th>Nama</th><th>Email</th><th>Role</th><th></th></tr></thead><tbody>${D.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role==='admin'?'👑 Admin':'Pembeli'}</td><td>${u.id===myId()?'':`<button class="btn sm sec" onclick="FM.setRole('${u.id}','${u.role==='admin'?'customer':'admin'}')">${u.role==='admin'?'Jadikan pembeli':'Jadikan admin'}</button>`}</td></tr>`).join('')||'<tr><td colspan=4>Belum ada pengguna.</td></tr>'}</tbody></table></div></div>`}
function tChat(){const threads=[...new Set(D.chats.map(m=>m.thread_user))];const th=S.thread||threads[0]||'';const list=D.chats.filter(m=>m.thread_user===th);const draft=S.draft;S.draft='';
return `<div class="panel"><h3>Chat pembeli</h3><div class="fr"><label>Pilih pembeli</label><select class="field" onchange="FM.selThread(this.value)">${threads.map(t=>`<option value="${esc(t)}" ${th===t?'selected':''}>${esc(nameOf(t))}</option>`).join('')||'<option value="">Belum ada chat</option>'}</select></div><div class="msgs" style="border:1px solid var(--line);border-radius:14px">${list.map(m=>`<div class="bub ${m.sender_id===myId()?'mine':''}"><b>${esc(nameOf(m.sender_id))}</b><br>${esc(m.body)}<div class="muted small">${fmtT(m.created_at)}</div></div>`).join('')||'<div class="empty" style="border:0">Belum ada pesan.</div>'}</div><form onsubmit="FM.send(event)" style="display:flex;gap:8px;margin-top:10px"><input id="chatIn" class="field" maxlength="1000" required placeholder="Balas pembeli..." value="${esc(draft)}"><button class="btn">Kirim</button></form></div>`}

function render(){applyTheme();let p=S.page;if(['orders','order','chat','notif'].includes(p)&&!S.me)p='auth';S.page=p;
const pages={home,catalog,detail,cart:cartPage,order:orderPage,orders:ordersPage,wish:wishPage,chat:chatPage,notif:notifPage,social,safety,admin:adminPage,auth:authPage};
$('app').innerHTML=(pages[p]||home)();}

/* ---------- ACTIONS ---------- */
async function go(p,id){if(id!==undefined)S.sel=id;S.page=p;await prep(p);render();window.scrollTo(0,0)}
const set=(k,v)=>{S[k]=v;render()};

const FM={
go,
set,
search(v){S.search=v;const g=$('grid');if(g)g.innerHTML=gridHTML()},
setPay(m){S.pay=m;render()},
adminTab(t){S.adminTab=t;go('admin')},
authMode(m){S.authMode=m;render()},
selThread(v){S.thread=v;render()},
cart(id){if(!D.cart.includes(id))D.cart.push(id);saveLs();render();toast('Ditambahkan ke keranjang')},
uncart(id){D.cart=D.cart.filter(x=>x!==id);saveLs();render()},
wish(id){D.wish=D.wish.includes(id)?D.wish.filter(x=>x!==id):[...D.wish,id];saveLs();render()},
applyVoucher(){S.voucher=($('vc')?.value||'').trim().toUpperCase();if(S.voucher&&!findVoucher(S.voucher))toast('Voucher tidak ditemukan');render()},
async checkout(){if(!S.me)return go('auth');if(!D.cfg.open)return toast('Toko sedang tutup');const ids=cartItems().map(p=>p.id);if(!ids.length)return toast('Keranjang kosong');
const {data,error}=await sb.rpc('create_order',{p_product_ids:ids,p_voucher:S.voucher||'',p_method:S.pay});if(error)return toast(errMsg(error));
D.cart=[];saveLs();S.voucher='';S.orderId=data;await loadOrders();await loadProducts();go('order');toast('Pesanan dibuat. Silakan lakukan pembayaran.')},
openOrder(id){S.orderId=id;go('order')},
async paid(id){const proof=$('proof')?.value?.trim()||'';const {error}=await sb.rpc('mark_paid',{p_order_id:id,p_proof:proof});if(error)return toast(errMsg(error));await loadOrders();render();toast('Konfirmasi terkirim. Menunggu verifikasi admin.')},
ask(id){const p=D.products.find(x=>x.id===id);if(!S.me){toast('Login dulu untuk chat');return go('auth')}S.draft=`Halo admin, saya ingin bertanya tentang ${p?p.title:'listing'}. `;go('chat')},
async authSubmit(e){e.preventDefault();const email=$('aEmail').value.trim(),pass=$('aPass').value,msg=$('aMsg');msg.className='small';
if(S.authMode==='register'){const name=$('aName').value.trim();const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{name}}});if(error){msg.className='small err';msg.textContent=errMsg(error);return}if(!data.session){msg.className='small ok';msg.textContent='Akun dibuat. Cek email untuk konfirmasi, lalu login.';return}S.authMode='login';toast('Akun berhasil dibuat');return go('home')}
const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error){msg.className='small err';msg.textContent='Email atau password salah.';return}toast('Login berhasil');go('home')},
async google(){const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}});if(error)toast(errMsg(error))},
async logout(){await sb.auth.signOut();S.me=null;S.prof=null;D.orders=[];D.notifs=[];go('home');toast('Kamu sudah keluar')},
async send(e){e.preventDefault();const t=$('chatIn').value.trim();if(!t||!S.me)return;const th=isAdmin()?S.thread:myId();if(!th)return toast('Pilih pembeli dulu');const {error}=await sb.from('chats').insert({thread_user:th,sender_id:myId(),body:t});if(error)return toast(errMsg(error));await loadChats();render()},
async review(pid){const t=($('rvT')?.value||'').trim();if(!t)return toast('Tulis ulasan dulu');const rating=Number($('rvR').value);const {error}=await sb.from('reviews').insert({product_id:pid,user_id:myId(),rating,text:t});if(error)return toast(errMsg(error));await loadReviews();render();toast('Terima kasih atas ulasanmu')},
async hideReview(id,hidden){const {error}=await sb.from('reviews').update({hidden}).eq('id',id);if(error)return toast(errMsg(error));await loadReviews();render()},
async delReview(id){if(!confirm('Hapus ulasan ini?'))return;const {error}=await sb.from('reviews').delete().eq('id',id);if(error)return toast(errMsg(error));await loadReviews();render()},
async readAll(){await sb.from('notifications').update({read:true}).eq('user_id',myId()).eq('read',false);await loadNotifs();render()},
editProduct(id){S.editId=id;S.adminTab='products';go('admin')},
async saveProduct(e){e.preventDefault();let image_url=D.products.find(p=>p.id===S.editId)?.image_url||null;const f=$('pFile').files[0];
try{if(f)image_url=await upload(f,`products/${Date.now()}-${f.name.replace(/[^a-z0-9.]/gi,'_')}`)}catch(err){return toast(errMsg(err))}
const d={title:$('pT').value.trim(),price:Number($('pP').value),rank:$('pR').value,level:Number($('pL').value)||1,tag:($('pTg').value.trim()||'NEW').toUpperCase(),emoji:$('pE').value.trim()||'🎮',status:$('pS').value,featured:$('pF').value==='1',image_url,description:$('pD').value.trim()};
const {error}=S.editId?await sb.from('products').update(d).eq('id',S.editId):await sb.from('products').insert(d);if(error)return toast(errMsg(error));S.editId=null;await loadProducts();render();toast('Listing disimpan')},
async delProduct(id){if(!confirm('Hapus listing ini?'))return;const {error}=await sb.from('products').delete().eq('id',id);if(error)return toast('Tidak bisa dihapus: '+errMsg(error));D.cart=D.cart.filter(x=>x!==id);D.wish=D.wish.filter(x=>x!==id);saveLs();await loadProducts();render();toast('Listing dihapus')},
async toggleFeat(id){const p=D.products.find(x=>x.id===id);const {error}=await sb.from('products').update({featured:!p.featured}).eq('id',id);if(error)return toast(errMsg(error));await loadProducts();render()},
async setStatus(id,status){const {error}=await sb.from('orders').update({status}).eq('id',id);if(error)return toast(errMsg(error));await Promise.all([loadOrders(),loadProducts()]);render();toast('Status pesanan diubah')},
async vAdd(e){e.preventDefault();const code=$('vCo').value.trim().toUpperCase();const {error}=await sb.from('vouchers').insert({code,type:$('vTy').value,value:Number($('vVa').value),min_total:Number($('vMi').value)||0,active:true});if(error)return toast(errMsg(error));await loadVouchers();render();toast('Voucher ditambahkan')},
async vToggle(code,active){const {error}=await sb.from('vouchers').update({active}).eq('code',code);if(error)return toast(errMsg(error));await loadVouchers();render()},
async vDel(code){if(!confirm('Hapus voucher ini?'))return;const {error}=await sb.from('vouchers').delete().eq('code',code);if(error)return toast(errMsg(error));await loadVouchers();render()},
async saveCfg(){const {error}=await sb.from('settings').upsert({key:'config',value:D.cfg},{onConflict:'key'});if(error)return toast(errMsg(error));render()},
async saveStore(e){e.preventDefault();const c=D.cfg;c.brand=$('sBr').value.trim()||c.brand;c.open=$('sOp').value==='1';c.announcement=$('sAn').value.trim();c.footer=$('sFo').value.trim();c.wa=$('sWa').value.replace(/\D/g,'');c.instagram=$('sIg').value.trim();c.tiktok=$('sTt').value.trim();c.facebook=$('sFb').value.trim();c.methods={transfer:{on:$('mT').checked,bank:$('tB').value.trim(),no:$('tN').value.trim(),name:$('tA').value.trim()},ewallet:{on:$('eOn').checked,name:$('eN').value.trim(),no:$('eNo').value.trim()},qris:{on:$('qOn').checked,img:c.methods.qris.img}};
const f=$('qFile').files[0];if(f){try{c.methods.qris.img=await upload(f,`qris/${Date.now()}.jpg`)}catch(err){return toast(errMsg(err))}}
await FM.saveCfg();toast('Pengaturan toko disimpan')},
async setTheme(id){D.cfg.theme=id;await FM.saveCfg();toast('Tema diterapkan')},
async customTheme(){D.cfg.theme='custom';D.cfg.accent=$('cA').value;D.cfg.accent2=$('cB').value;await FM.saveCfg();toast('Warna kustom diterapkan')},
async uploadThemeBg(inp){const f=inp.files[0];if(!f)return;try{const url=await upload(f,`themes/${D.cfg.theme}-${Date.now()}`);D.cfg.bgImgs={...(D.cfg.bgImgs||{}),[D.cfg.theme]:url};await FM.saveCfg();toast('Latar tema disimpan')}catch(err){toast(errMsg(err))}},
async clearThemeBg(){if(D.cfg.bgImgs)delete D.cfg.bgImgs[D.cfg.theme];await FM.saveCfg();toast('Latar tema dihapus')},
async setRole(id,role){if(!confirm('Ubah role pengguna ini?'))return;const {error}=await sb.from('profiles').update({role}).eq('id',id);if(error)return toast(errMsg(error));await loadUsers();render();toast('Role diubah')}
};
window.FM=FM;

/* ---------- START ---------- */
async function init(){
 const {data:{session}}=await sb.auth.getSession();
 S.me=session?.user||null;
 await Promise.all([loadCfg(),loadProducts(),loadProfile(),loadNotifs()]);
 render();
 sb.auth.onAuthStateChange(async(ev,sess)=>{if((sess?.user?.id||null)===(S.me?.id||null))return;S.me=sess?.user||null;await Promise.all([loadProfile(),loadNotifs(),loadCfg()]);if(S.me&&ev==='SIGNED_IN'&&(S.page==='auth'))S.page='home';render()});
}
init();
</script>
</body></html>
